; K9 MK5: two current boards in one source project.
;   esp32dev / esp32dev-ota: ESP32 DevKit, four servos and GPIO25 speaker.
;   esp32cam / esp32cam-ota: AI-Thinker ESP32-CAM, video and GPIO4 light.
; Both normal targets compile by default. Explicit *-ota targets upload only
; when requested with -t upload. See README.md and boards/ for setup.
; C3/gamepad, tune and trim targets below are legacy, not the MK5 pinout.

[platformio]
default_envs = esp32dev, esp32cam

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
build_flags =
    -DCORE_DEBUG_LEVEL=1
    ; Route Serial over the C3's native USB (no separate USB-UART chip).
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; Uncomment to hold every leg at center for mounting the legs on the shafts:
    ; -DCALIBRATE

; ---- default: ESP-NOW gamepad, USB flash ----------------------------------
; SuperMini's native-USB ROM downloader chokes on the stub loader; --no-stub
; @115200 is the reliable combo.
[env:esp32-c3-supermini]
upload_speed = 115200
upload_flags = --no-stub

; ---- WiFi tuning build, FIRST flash over USB -----------------------------
[env:tune]
build_flags = ${env.build_flags} -DTUNE_MODE
upload_speed = 115200
upload_flags = --no-stub


;; ---- leg TRIM console: legs hang straight, four letters nudge one leg each
;; (f/g/b/n <deg>), no walking. USB first flash, then OTA.
[env:trim]
build_flags = ${env.build_flags} -DTUNE_MODE -DAUTO_TRIM
upload_speed = 115200
upload_flags = --no-stub

[env:trim-ota]
build_flags = ${env.build_flags} -DTUNE_MODE -DAUTO_TRIM
upload_protocol = espota
upload_port = walker.local


; ---- WiFi tuning build, flashed over the NETWORK (OTA) -------------------
[env:tune-ota]
build_flags = ${env.build_flags} -DTUNE_MODE
upload_protocol = espota
upload_port = walker.local            ; or the board's IP; override: --upload-port <ip>
; upload_flags = --auth=YOUR_OTA_PASS  ; uncomment if OTA_PASS is set in secrets.h

; ---- AI-Thinker ESP32-CAM build (USB / dev/ttyUSB0) ----------------------
[env:esp32cam]
platform = espressif32@6.5.0
board = esp32cam
board_build.partitions = partitions_k9.csv   ; 2 OTA slots + LittleFS log (changing it needs a USB flash)
board_build.filesystem = littlefs
framework = arduino
monitor_speed = 115200
upload_speed = 460800
upload_port = /dev/ttyUSB0
monitor_port = /dev/ttyUSB0
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DBOARD_ESP32CAM
    -DK9_CAM_ONLY               ; this board = camera + flashlight ONLY (servos live on the esp32dev board)
    -Wl,--wrap=xTaskCreatePinnedToCore

; ---- AI-Thinker ESP32-CAM OTA over Home Wi-Fi ----------------------------
[env:esp32cam-ota]
extends = env:esp32cam
upload_protocol = espota
upload_port = k9cam.local



; Diagnostic build: same firmware WITHOUT the camera (isolates power/Wi-Fi problems)
[env:esp32cam-nocam]
extends = env:esp32cam
build_flags = ${env:esp32cam.build_flags} -DK9_NO_CAM

; Plain ESP32 DevKit (no camera) running the SAME control firmware: Wi-Fi + UDP/HTTP + OTA +
; flash log, driven by the hub dashboard. Servo signals on GPIO14 FL, 15 FR, 13 RL, 2 RR.
[env:esp32dev]
platform = espressif32@6.5.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800
board_build.partitions = partitions_k9.csv
board_build.filesystem = littlefs
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DBOARD_ESP32CAM
    -DK9_NO_CAM
    -DK9_SPEAKER_GPIO=25

; OTA for the plain ESP32 (legs) board. Password = K9_OTA_PASS from src/secrets.h (see ../ota.sh).
[env:esp32dev-ota]
extends = env:esp32dev
upload_protocol = espota
upload_port = k9.local
