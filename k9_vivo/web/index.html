<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1110">
<title>K9 Vivo</title>
<script src="/i18n/strings-ui.js"></script><script src="/i18n/strings-dyn.js"></script><script src="/i18n/strings-extra.js"></script><script src="/i18n/i18n.js"></script>
<style>
  :root { --bg:#0e1110; --card:#171c1a; --line:#2a332f; --tx:#e8efe9; --mut:#9aaba3; --ok:#5bd68a; --warn:#f0b03c; --bad:#ef4b3a; --accent:#ef593f; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--tx); font:16px/1.4 system-ui,sans-serif; min-height:100dvh; display:flex; flex-direction:column; padding:env(safe-area-inset-top) 14px env(safe-area-inset-bottom); }
  header { display:flex; align-items:center; justify-content:space-between; padding:12px 0; }
  #langSelect { background:var(--card); color:var(--tx); border:1px solid var(--line); border-radius:999px; min-height:36px; padding:0 8px; font:inherit; font-size:.8rem; }
  h1 { font-size:1.1rem; margin:0; letter-spacing:.08em; text-transform:uppercase; }
  .chips { display:flex; gap:6px; flex-wrap:wrap; justify-content:flex-end; }
  .chip { font-size:.72rem; padding:4px 9px; border-radius:999px; border:1px solid var(--line); color:var(--mut); }
  .chip.on { color:var(--ok); border-color:var(--ok); } .chip.warn { color:var(--warn); border-color:var(--warn); } .chip.bad { color:var(--bad); border-color:var(--bad); }
  #log { flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:8px; padding:6px 0; min-height:120px; }
  .msg { max-width:88%; padding:10px 12px; border-radius:14px; background:var(--card); border:1px solid var(--line); }
  .msg.eu { align-self:flex-end; background:#1d2a24; } .msg.k9 { align-self:flex-start; } .msg.sis { align-self:center; color:var(--mut); font-size:.8rem; background:none; border:none; }
  .controles { display:grid; gap:10px; padding:10px 0 14px; }
  #mic { height:104px; border-radius:22px; border:2px solid var(--accent); background:var(--card); color:var(--tx); font-size:1.15rem; font-weight:600; }
  #mic.ouvindo { background:var(--accent); animation:pulsa 1.1s ease-in-out infinite; }
  @keyframes pulsa { 50% { box-shadow:0 0 0 12px #ef593f33; } } @media (prefers-reduced-motion:reduce) { #mic.ouvindo { animation:none; } }
  .linha { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  button { font:inherit; color:var(--tx); background:var(--card); border:1px solid var(--line); border-radius:14px; min-height:52px; }
  #parar { background:var(--bad); border-color:var(--bad); font-weight:700; letter-spacing:.06em; min-height:60px; }
  #armar.armado { border-color:var(--ok); color:var(--ok); }
  label.cont { display:flex; align-items:center; gap:10px; color:var(--mut); font-size:.9rem; }
  input[type=checkbox] { width:22px; height:22px; accent-color:var(--accent); }
  #aviso { color:var(--warn); font-size:.82rem; min-height:1.2em; }
</style>
</head>
<body>
<header><h1 id="titulo">K9 · Vivo</h1><div class="chips"><select id="langSelect" data-no-i18n aria-label="Idioma" title="Idioma"></select><span class="chip" id="cLink">conectando…</span><span class="chip" id="cRobo">robô ?</span><span class="chip" id="cIa">IA ?</span><span class="chip" id="cArm">desarmado</span></div></header>
<div id="log" aria-live="polite"></div>
<div id="aviso" role="status"></div>
<div class="controles">
  <button id="mic" type="button" aria-pressed="false">🎤 Toque para falar</button>
  <label class="cont"><input type="checkbox" id="cont"> Escuta contínua (só obedece se eu chamar pelo nome)</label>
  <div class="linha"><button id="armar" type="button">Ativar Vivo</button><button id="parar" type="button">PARAR</button></div>
</div>
<script>
(() => {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const RC = window.SpeechRecognition || window.webkitSpeechRecognition;
  let nome = 'K9', ws, armado = false, rec = null, ouvindo = false, falando = false, quer = false;

  const T = (k, ...a) => (window.K9I18n ? K9I18n.t(k, ...a) : k);
  const tag = () => (window.K9I18n ? K9I18n.tag() : 'pt-BR'), code = () => (window.K9I18n ? K9I18n.lang() : 'pt');
  const add = (cls, txt) => { const d = document.createElement('div'); d.className = 'msg ' + cls; d.textContent = txt; $('log').append(d); $('log').scrollTop = 1e9; };
  const chip = (id, txt, cls) => { const e = $(id); e.textContent = txt; e.className = 'chip ' + (cls || ''); };
  const env = (o) => { if (ws && ws.readyState === 1) ws.send(JSON.stringify(o)); };

  function conectar() {
    ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws');
    ws.onopen = () => chip('cLink', 'conectado', 'on');
    ws.onclose = () => { chip('cLink', 'desconectado', 'bad'); parar(); setTimeout(conectar, 2000); };
    ws.onmessage = (e) => {
      const m = JSON.parse(e.data);
      if (m.type === 'say') { const x = T(m.text); add('k9', x); falar(x); }
      else if (m.type === 'heard') add('eu', m.text);
      else if (m.type === 'state') {
        if (m.nome) { $('titulo').textContent = m.nome + ' · Vivo'; document.title = m.nome + ' · Vivo'; nome = m.nome; $('aviso').title = ''; }
        armado = m.armed; $('armar').textContent = armado ? 'Desligar Vivo' : 'Ativar Vivo'; $('armar').classList.toggle('armado', armado);
        chip('cArm', armado ? 'ARMADO' : 'desarmado', armado ? 'warn' : ''); chip('cRobo', m.robot ? 'robô online' : 'robô offline', m.robot ? 'on' : 'bad');
        chip('cIa', m.ia ? 'IA ligada' : 'só comandos simples', m.ia ? 'on' : 'warn'); $('aviso').textContent = m.aviso || '';
      }
    };
  }

  function falar(t) {
    if (!('speechSynthesis' in window)) return;
    const u = new SpeechSynthesisUtterance(t); u.lang = tag(); u.rate = 1.05;
    const v = speechSynthesis.getVoices().find((x) => x.lang === tag()); if (v) u.voice = v;
    falando = true; if (rec && ouvindo) rec.stop();                                  // não escutar a própria voz
    u.onend = u.onerror = () => { falando = false; if (quer) iniciar(); };
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  }

  function iniciar() {
    if (!RC) { $('aviso').textContent = 'Este navegador não tem reconhecimento de voz. Abra no Chrome.'; return; }
    if (ouvindo || falando) return;
    rec = new RC(); rec.lang = tag(); rec.interimResults = false; rec.continuous = false; rec.maxAlternatives = 1;
    rec.onstart = () => { ouvindo = true; $('mic').classList.add('ouvindo'); $('mic').textContent = '🎙️ Ouvindo…'; $('mic').setAttribute('aria-pressed', 'true'); };
    rec.onresult = (e) => { const t = e.results[0][0].transcript.trim(); if (t) env({ type: 'transcript', text: t, continuo: $('cont').checked, lang: code() }); };
    rec.onerror = (e) => { if (e.error === 'not-allowed') { $('aviso').textContent = 'Microfone bloqueado: permita nas configurações do site.'; quer = false; } };
    rec.onend = () => { ouvindo = false; $('mic').classList.remove('ouvindo'); $('mic').setAttribute('aria-pressed', 'false'); $('mic').textContent = quer ? '🎤 Escutando…' : '🎤 Toque para falar'; if (quer && !falando) setTimeout(iniciar, 250); };
    try { rec.start(); } catch (e) { /* já iniciado */ }
  }
  function parar() { quer = false; if (rec) { try { rec.stop(); } catch (e) { /* ok */ } } }

  $('mic').onclick = () => { if (ouvindo) { parar(); } else { quer = $('cont').checked; iniciar(); } };
  $('cont').onchange = () => { if (!$('cont').checked) parar(); };
  $('armar').onclick = () => env({ type: armado ? 'disarm' : 'arm' });
  $('parar').onclick = () => { parar(); speechSynthesis.cancel(); env({ type: 'stop' }); };
  window.addEventListener('beforeunload', () => env({ type: 'stop' }));
  document.addEventListener('visibilitychange', () => { if (document.hidden) parar(); });
  add('sis', 'Diga "ativar vivo" ou toque em Ativar. Em escuta contínua, comece pelo nome do robô. "Para" sempre para.');
  conectar();
})();
</script>
</body>
</html>
